[package]
name = "trill"
version = "0.1.1"
edition = "2024"
description = "Lean terminal Spotify player for CachyOS"

[dependencies]
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-protocol = "0.8"
protobuf = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
protobuf-json-mapping = "3"
http = "1"
bytes = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
libc = "0.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", default-features = false, features = ["tokio"] }
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls", "pulseaudio-backend"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls", "rodio-backend"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
