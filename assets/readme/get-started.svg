<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-label="Get started, about ten minutes, once: 1. Install: $ curl -fsSL …/trill-linux-x86_64.tar.gz | tar -xz; 2. Get a Soloist key: developer.spotify.com → Soloist API Key; 3. Save it: ~/.config/trill/soloist_api_key; 4. Get Soloist: $ trill --update-soloist; 5. Pair your phone: $ trill --pair; 6. Play: $ trill.">
<style>
@font-face{font-family:tm;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:tm;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:tm,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<rect width="880" height="316" rx="6" fill="#0d0d0d"/>
<rect x=".5" y=".5" width="879" height="315" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.5" y="26.5" width="831" height="263" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="36" y="24" width="97.8" height="5" fill="#0d0d0d"/>
<text x="42" y="30.5" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start">get started</text>
<rect x="580.0" y="24" width="264.0" height="5" fill="#0d0d0d"/>
<text x="838" y="30.5" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end">~10 minutes, once · Spotify Premium</text>
<text x="52" y="76" font-size="13" font-weight="500" fill="#5b5b5b" text-anchor="start">01</text>
<text x="92" y="76" font-size="13.5" font-weight="500" fill="#ececec" text-anchor="start">Install</text>
<text x="300" y="76" font-size="13" font-weight="400" fill="#5b5b5b" text-anchor="start">$</text>
<text x="318" y="76" font-size="13" font-weight="400" fill="#ececec" text-anchor="start">curl -fsSL …/trill-linux-x86_64.tar.gz | tar -xz</text>
<line x1="52" y1="89" x2="828" y2="89" stroke="#1b1b1b"/>
<text x="52" y="112" font-size="13" font-weight="500" fill="#5b5b5b" text-anchor="start">02</text>
<text x="92" y="112" font-size="13.5" font-weight="500" fill="#ececec" text-anchor="start">Get a Soloist key</text>
<text x="318" y="112" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">developer.spotify.com → Soloist API Key</text>
<line x1="52" y1="125" x2="828" y2="125" stroke="#1b1b1b"/>
<text x="52" y="148" font-size="13" font-weight="500" fill="#5b5b5b" text-anchor="start">03</text>
<text x="92" y="148" font-size="13.5" font-weight="500" fill="#ececec" text-anchor="start">Save it</text>
<text x="318" y="148" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">~/.config/trill/soloist_api_key</text>
<line x1="52" y1="161" x2="828" y2="161" stroke="#1b1b1b"/>
<text x="52" y="184" font-size="13" font-weight="500" fill="#5b5b5b" text-anchor="start">04</text>
<text x="92" y="184" font-size="13.5" font-weight="500" fill="#ececec" text-anchor="start">Get Soloist</text>
<text x="300" y="184" font-size="13" font-weight="400" fill="#5b5b5b" text-anchor="start">$</text>
<text x="318" y="184" font-size="13" font-weight="400" fill="#ececec" text-anchor="start">trill --update-soloist</text>
<line x1="52" y1="197" x2="828" y2="197" stroke="#1b1b1b"/>
<text x="52" y="220" font-size="13" font-weight="500" fill="#5b5b5b" text-anchor="start">05</text>
<text x="92" y="220" font-size="13.5" font-weight="500" fill="#ececec" text-anchor="start">Pair your phone</text>
<text x="300" y="220" font-size="13" font-weight="400" fill="#5b5b5b" text-anchor="start">$</text>
<text x="318" y="220" font-size="13" font-weight="400" fill="#ececec" text-anchor="start">trill --pair</text>
<line x1="52" y1="233" x2="828" y2="233" stroke="#1b1b1b"/>
<text x="52" y="256" font-size="13" font-weight="500" fill="#1ed760" text-anchor="start">06</text>
<text x="92" y="256" font-size="13.5" font-weight="500" fill="#ececec" text-anchor="start">Play</text>
<text x="300" y="256" font-size="13" font-weight="400" fill="#5b5b5b" text-anchor="start">$</text>
<text x="318" y="256" font-size="13" font-weight="400" fill="#ececec" text-anchor="start">trill</text>
</svg>
