<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Get started in four steps, about ten minutes, once. 1: install trill with one command. 2: get a free Soloist API key from Spotify&#x27;s developer dashboard and save it. 3: run trill --update-soloist to download Spotify&#x27;s player. 4: run trill --pair once with your phone, then just trill.">
<style>
@font-face{font-family:tm;font-weight:400;src:url(data:font/woff2;base64,)}
@font-face{font-family:tm;font-weight:500;src:url(data:font/woff2;base64,)}
@font-face{font-family:tm;font-weight:600;src:url(data:font/woff2;base64,)}
text{font-family:tm,tf,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<defs><marker id="sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5b5b5b"/></marker></defs>
<rect x="0.00" y="0.00" width="880.00" height="190.00" rx="6" fill="#0d0d0d"/>
<rect x="0.50" y="0.50" width="879.00" height="189.00" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.50" y="26.50" width="831.00" height="137.00" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="36.00" y="24.00" width="99.80" height="5.00" fill="#0d0d0d"/>
<text x="42.00" y="30.50" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start" xml:space="preserve">get started</text>
<rect x="665.40" y="24.00" width="179.60" height="5.00" fill="#0d0d0d"/>
<text x="851.00" y="30.50" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">about ten minutes, once</text>
<circle cx="62.0" cy="76" r="13" fill="#1ed760"/>
<text x="62.00" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">1</text>
<text x="84.00" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Install</text>
<text x="84.00" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">one command,</text>
<text x="84.00" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">see below</text>
<path d="M218.0 76L240.0 76" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#sa)"/>
<circle cx="266.0" cy="76" r="13" fill="#1ed760"/>
<text x="266.00" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">2</text>
<text x="288.00" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Soloist key</text>
<text x="288.00" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">free, from Spotify's</text>
<text x="288.00" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">developer dashboard</text>
<path d="M422.0 76L444.0 76" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#sa)"/>
<circle cx="470.0" cy="76" r="13" fill="#1ed760"/>
<text x="470.00" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">3</text>
<text x="492.00" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Get Soloist</text>
<text x="492.00" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">trill --update-soloist</text>
<text x="492.00" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">downloads it</text>
<path d="M626.0 76L648.0 76" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#sa)"/>
<circle cx="674.0" cy="76" r="13" fill="#1ed760"/>
<text x="674.00" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">4</text>
<text x="696.00" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Pair, play</text>
<text x="696.00" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">trill --pair once,</text>
<text x="696.00" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">then just trill</text>
</svg>
