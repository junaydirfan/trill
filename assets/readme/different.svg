<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="What&#x27;s different about trill: Plays where librespot can&#x27;t: Audio comes from Soloist, Spotify&#x27;s own player, so it works on accounts that refuse librespot.; Small and quiet: About 17.4 MB of memory, and no CPU or timers while idle. It redraws only when something changes.; For You, worked out here: Suggestions from what you play, ranked on your computer. Your play history stays on it.; Your whole library: Playlists, folders, pins, albums, artists, lyrics. Through Spotify&#x27;s own API: no Web API limits.">
