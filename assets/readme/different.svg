<text x="475.00" y="194.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Your whole library</text>
<text x="463.00" y="220.00" font-size="11" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">Playlists, folders, pins, albums, artists, lyrics.</text>
