<text x="463.00" y="112.00" font-size="11" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">About 17.4 MB of memory, and no CPU or timers</text>
<text x="463.00" y="129.00" font-size="11" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">while idle. It redraws only when something changes.</text>
