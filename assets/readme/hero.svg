<tspan x="44" y="170">\__/_/  /_/_/_/   </tspan>
</text>
<text x="372" y="82" font-size="27" font-weight="500" fill="#ececec" text-anchor="start" letter-spacing="-.6">Spotify in your terminal.</text>
<text x="372" y="112" font-size="14" font-weight="400" fill="#8f8f8f" text-anchor="start">Lighter than the tab you'd open to look it up.</text>
<path d="M372 151L380.5 155.5L372 160z" fill="#1ed760"/>
