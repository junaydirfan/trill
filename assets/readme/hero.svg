<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="trill: Spotify in your terminal. Lighter than the tab you'd open to look it up. About 20 MB of RAM, 0% CPU while idle, about 2 ms from key press to frame, about 30 ms from launch to library.">
<style>
@font-face{font-family:tm;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:tm;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:tm;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:tm,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<rect width="880" height="352" rx="6" fill="#0d0d0d"/>
<rect x=".5" y=".5" width="879" height="351" rx="6" fill="none" stroke="#1f1f1f"/>
