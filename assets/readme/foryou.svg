<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="How For You works. 1: what you play: every song played for 30 seconds, logged on your computer, older plays counting less. 2: your seeds: your top songs and top artists. 3: Spotify&#x27;s radio of those songs and the artists related to yours, fetched at once and kept for 12 hours. 4: ranked here: liked songs left out, songs you play a lot pushed down, no one artist takes over, and X hides a song for good. Your play history stays on your computer.">
<style>
@font-face{font-family:tm;font-weight:400;src:url(data:font/woff2;base64,)}
@font-face{font-family:tm;font-weight:500;src:url(data:font/woff2;base64,)}
@font-face{font-family:tm;font-weight:600;src:url(data:font/woff2;base64,)}
text{font-family:tm,tf,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<defs><marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5b5b5b"/></marker></defs>
<rect x="0.00" y="0.00" width="880.00" height="280.00" rx="6" fill="#0d0d0d"/>
<rect x="0.50" y="0.50" width="879.00" height="279.00" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.50" y="26.50" width="831.00" height="227.00" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="36.00" y="24.00" width="146.60" height="5.00" fill="#0d0d0d"/>
<text x="42.00" y="30.50" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start" xml:space="preserve">how For You works</text>
<rect x="543.00" y="24.00" width="302.00" height="5.00" fill="#0d0d0d"/>
<text x="851.00" y="30.50" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">your play history stays on your computer</text>
<rect x="44.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<circle cx="70.0" cy="90" r="12" fill="#2a2a2a"/>
<text x="70.00" y="94.50" font-size="13" font-weight="600" fill="#ececec" text-anchor="middle" xml:space="preserve">1</text>
<text x="60.00" y="130.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">What you play</text>
<text x="60.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">each song after 30 s,</text>
<text x="60.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">older plays count less</text>
<path d="M225.0 124L244.0 124" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#fa)"/>
<rect x="249.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<circle cx="275.0" cy="90" r="12" fill="#2a2a2a"/>
<text x="275.00" y="94.50" font-size="13" font-weight="600" fill="#ececec" text-anchor="middle" xml:space="preserve">2</text>
<text x="265.00" y="130.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Your seeds</text>
<text x="265.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your top songs and</text>
<text x="265.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your top artists</text>
<path d="M430.0 124L449.0 124" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#fa)"/>
<rect x="454.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<circle cx="480.0" cy="90" r="12" fill="#2a2a2a"/>
<text x="480.00" y="94.50" font-size="13" font-weight="600" fill="#ececec" text-anchor="middle" xml:space="preserve">3</text>
<text x="470.00" y="130.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Ask Spotify</text>
<text x="470.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">their radio, related</text>
<text x="470.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">artists; kept 12 hours</text>
<path d="M635.0 124L654.0 124" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#fa)"/>
<rect x="659.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#1ed760"/>
<circle cx="685.0" cy="90" r="12" fill="#1ed760"/>
<text x="685.00" y="94.50" font-size="13" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">4</text>
<text x="675.00" y="130.00" font-size="14" font-weight="600" fill="#1ed760" text-anchor="start" xml:space="preserve">Ranked here</text>
<text x="675.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">liked: left out</text>
<text x="675.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">played a lot: down</text>
<text x="440.00" y="222.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="middle" xml:space="preserve">No artist gets more than 3 songs. The Why column says where each came from; X hides one for good.</text>
</svg>
