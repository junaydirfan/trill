<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="What trill does, by key: L: Synced lyrics, the line lights up as it's sung; i: Album art, real images in kitty, Ghostty, iTerm2; e: 10-band EQ, 11 presets, only trill's audio; s: Smart shuffle, a Spotify pick after every three; x: Crossfade, Spotify's own, gapless, 320 kbps; I: Private session, hidden from friends and Discord; f: Like, save, follow, songs, albums and artists; A: Playlists, add to yours or remove from them; /: Search, songs, albums, artists, playlists; y: Copy link, any song, album or playlist. Plus media keys, the lock screen, the KDE media widget and your phone through Spotify Connect.">
