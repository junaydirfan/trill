<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="How it works. trill runs its screen and networking on one async thread, with keys read on a thread of their own. It browses your library through librespot&#x27;s session, the same private API the official apps use, so no Web API limits apply, and keeps your lists on disk so they open at once. It drives Soloist, Spotify&#x27;s own headless player, over a local WebSocket; Soloist streams from Spotify and plays through PipeWire, with the EQ when it&#x27;s on. The desktop gets MPRIS on Linux and Now Playing on macOS.">
