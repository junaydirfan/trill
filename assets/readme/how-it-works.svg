<text x="851.00" y="30.50" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">Premium account · no Web API limits</text>
<rect x="52.50" y="58.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="66.00" y="80.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Spotify</text>
<text x="66.00" y="100.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your library, search,</text>
<text x="66.00" y="117.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">lyrics, radio: through</text>
<text x="66.00" y="134.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">librespot's session</text>
<rect x="52.50" y="176.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="66.00" y="198.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">On disk</text>
<text x="66.00" y="218.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">lists, settings, plays:</text>
<text x="66.00" y="235.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">open at once, refresh</text>
<text x="66.00" y="252.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">in the background</text>
<rect x="318.50" y="58.50" width="244.00" height="120.00" rx="4" fill="#1b1b1b" stroke="#1ed760"/>
<text x="332.00" y="80.00" font-size="13" font-weight="600" fill="#1ed760" text-anchor="start" xml:space="preserve">trill</text>
<text x="332.00" y="100.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">one async thread:</text>
<text x="332.00" y="117.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">screen + network</text>
<text x="332.00" y="134.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">redraws only on change</text>
<text x="332.00" y="151.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">keys on their own thread</text>
<rect x="318.50" y="200.50" width="244.00" height="68.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="332.00" y="222.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Soloist</text>
<text x="332.00" y="242.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">Spotify's own player,</text>
<text x="332.00" y="259.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">driven over a WebSocket</text>
<rect x="632.50" y="58.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="646.00" y="80.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Desktop</text>
<text x="646.00" y="100.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">media keys, widgets:</text>
<text x="646.00" y="117.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">MPRIS · Now Playing</text>
<text x="646.00" y="134.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your phone: Connect</text>
<rect x="632.50" y="176.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="646.00" y="198.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Sound</text>
<text x="646.00" y="218.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">PipeWire, with the EQ</text>
