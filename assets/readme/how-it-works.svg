<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="How it works: trill runs its UI and network on one async thread. It browses Spotify through a librespot session, with no Web API limits, talks to your desktop over MPRIS, and drives Soloist, Spotify's own player, over a local WebSocket. Soloist streams from Spotify and plays through PipeWire, through the EQ when it's on.">
<style>
@font-face{font-family:tm;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:tm;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:tm,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<rect width="880" height="500" rx="6" fill="#0d0d0d"/>
<rect x=".5" y=".5" width="879" height="499" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.5" y="26.5" width="831" height="447" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="36" y="24" width="105.6" height="5" fill="#0d0d0d"/>
<text x="42" y="30.5" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start">how it works</text>
<rect x="637.6" y="24" width="206.4" height="5" fill="#0d0d0d"/>
<text x="838" y="30.5" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end">two connections, one thread</text>
<rect x="52.5" y="70.5" width="239" height="103" rx="3" fill="none" stroke="#1ed760"/>
<rect x="64" y="68" width="51.0" height="5" fill="#0d0d0d"/>
<text x="70" y="74.5" font-size="13" font-weight="500" fill="#1ed760" text-anchor="start">trill</text>
<text x="68" y="100" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">One async thread for UI</text>
<text x="68" y="118" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">and network. Redraws only</text>
<text x="68" y="136" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">on change. Never polls.</text>
<rect x="588.5" y="70.5" width="239" height="103" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="600" y="68" width="66.6" height="5" fill="#0d0d0d"/>
<text x="606" y="74.5" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start">spotify</text>
<text x="604" y="100" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">Library, search, lyrics,</text>
<text x="604" y="118" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">edits, audio, Connect.</text>
<rect x="52.5" y="264.5" width="239" height="85" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="64" y="262" width="105.6" height="5" fill="#0d0d0d"/>
<text x="70" y="268.5" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start">your desktop</text>
<text x="68" y="294" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">Media keys, lock screen,</text>
<text x="68" y="312" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">KDE widget (MPRIS).</text>
<rect x="320.5" y="264.5" width="239" height="85" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="332" y="262" width="66.6" height="5" fill="#0d0d0d"/>
<text x="338" y="268.5" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start">soloist</text>
<text x="336" y="294" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">Spotify's own player.</text>
<text x="336" y="312" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">320 kbps, crossfade.</text>
<rect x="320.5" y="394.5" width="239" height="65" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="332" y="392" width="74.4" height="5" fill="#0d0d0d"/>
<text x="338" y="398.5" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start">pipewire</text>
<text x="336" y="424" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">Through the EQ when on.</text>
<path d="M292 114 L588 114" fill="none" stroke="#5b5b5b" stroke-width="1.2"/>
