<text x="440" y="105" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="middle">librespot</text>
<path d="M588 130 L292 130" fill="none" stroke="#5b5b5b" stroke-width="1.2"/>
<path d="M292 130L299.0 126.5L299.0 133.5z" fill="#5b5b5b"/>
<text x="440" y="150" font-size="11.5" font-weight="400" fill="#5b5b5b" text-anchor="middle">no Web API limits</text>
<path d="M200 174 L200 264" fill="none" stroke="#5b5b5b" stroke-width="1.2"/>
<path d="M200 264L196.5 257.0L203.5 257.0z" fill="#5b5b5b"/>
<text x="212" y="224" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start">mpris</text>
<path d="M262 174 L262 219 L500 219 L500 264" fill="none" stroke="#5b5b5b" stroke-width="1.2"/>
<path d="M500 264L496.5 257.0L503.5 257.0z" fill="#5b5b5b"/>
<text x="284" y="211" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start">local websocket</text>
<path d="M760 174 L760 307 L560 307" fill="none" stroke="#5b5b5b" stroke-width="1.2"/>
<path d="M560 307L567.0 303.5L567.0 310.5z" fill="#5b5b5b"/>
<text x="748" y="299" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="end">audio, connect</text>
<path d="M500 350 L500 394" fill="none" stroke="#5b5b5b" stroke-width="1.2"/>
<path d="M500 394L496.5 387.0L503.5 387.0z" fill="#5b5b5b"/>
</svg>
