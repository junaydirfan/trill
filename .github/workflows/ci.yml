# Builds and tests trill on Linux, macOS (Apple Silicon) and Windows on every push.
# A `v*` tag also attaches a ready-to-run binary for each to that GitHub release.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # only used on tags, to upload release files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: trill-linux-x86_64.tar.gz
          - os: macos-latest
            asset: trill-macos-arm64.tar.gz
          - os: windows-latest
            asset: trill-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # `trill --update` compares the release tag with the version built into trill
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev pkg-config libssl-dev

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy

      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cargo clippy --release --locked

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "${{ matrix.asset }}" ./target/release/trill.exe
          else
            tar -czf "${{ matrix.asset }}" -C target/release trill
          fi

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # whichever job gets here first creates the release; the others just upload
          gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
